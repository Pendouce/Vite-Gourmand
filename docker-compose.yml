services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: php
    volumes:
      - .:/var/www/html
    networks:
      - vgNetwork
  web:
    image: nginx:1.30.3-alpine3.23-slim
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - php
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vgNetwork

  db:
    image: mysql:8.0
    container_name: db_mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - data_db:/var/lib/mysql
    networks:
      - vgNetwork
  pma:
    image: phpmyadmin:5.2.3
    container_name: phpMyAdmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - vgNetwork

  mongo:
    image: mongo
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - data_mongo:/data/db
    networks:
      - vgNetwork

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongo
    networks:
      - vgNetwork

  node:
    image: node:24.18.0-alpine3.23
    container_name: node
    working_dir: /var/www/html
    stdin_open: true
    tty: true

    volumes:
      - .:/var/www/html
    command: sh -c "npm install || true && npm approve-scripts @parcel/watcher || true && npm run dev"
    networks:
      - vgNetwork

volumes:
  data_db:
  data_mongo:
networks:
  vgNetwork:
